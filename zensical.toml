[project]
site_name = "countrycode"
site_url = "https://vincentarelbundock.github.io/countrycode/"
site_description = "Convert country names and country codes in R"
repo_url = "https://github.com/vincentarelbundock/countrycode"
docs_dir = "docs-src"
site_dir = "docs"
nav = [
    { "Home" = "index.md" },
    { "Articles" = [
        { "Country codes" = "articles/countrycode.md" },
        { "Country names" = "articles/countryname.md" },
        { "Custom conversions" = "articles/custom.md" },
        { "Contributions" = "articles/contributions.md" },
    ] },
    { "Reference" = [
        { "R" = "reference/r/index.md" },
        { "Python" = "reference/python.md" },
    ] },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false
